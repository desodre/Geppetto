name: CI

# CI of main (and of the PyPI publish, which calls it). The dev branch has its own
# workflow (dev.yml) that also runs the emulator integration tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  checks:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check src tests integration

      - name: Ruff (format)
        run: uv run ruff format --check src tests integration

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest
