name: CI

# Shared validation for main, dev and publishing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: Android integration
    uses: ./.github/workflows/integration.yml

  checks:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --frozen --group dev --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check src tests integration scripts examples/recipes

      - name: Ruff (format)
        run: uv run ruff format --check src tests integration scripts examples/recipes

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Documentation and typed example
        if: matrix.python-version == '3.12'
        run: |
          uv run --group docs mkdocs build --strict
          uv run mypy examples/recipes/typing_example.py
