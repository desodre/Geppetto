[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geppetto"
version = "2.0.1"
description = "Android UI Automation Framework — like Geppetto brought Pinocchio to life, this tool brings your tests to life."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Jhonatha Sodre", email = "jhonathacirilo9000@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "adbutils>=2.9.3",
    "lxml>=6.0.0",
    "pillow>=11.0.0",
    "uiautomator2>=3.3.3",
]

[project.optional-dependencies]
analyzers = [
    "opencv-python>=4.9.0",
    "imagehash>=4.3.1",
    "extcolors>=1.0.0",
    "numpy>=1.26.0",
]

hardware = [
    "brainstem>=2.9.0",
]

all = ["geppetto[analyzers,hardware]"]

[project.urls]
Homepage = "https://github.com/jhonathasodre/geppetto"
Repository = "https://github.com/jhonathasodre/geppetto"
Issues = "https://github.com/jhonathasodre/geppetto/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/geppetto"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "uiautomator2.*",
    "lxml.*",
    "imagehash.*",
    "extcolors.*",
    "numpy.*",
    "brainstem.*",
]
ignore_missing_imports = true

